<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>PANDEMIA</title>
    <!--
      GitHub Pages отдаёт этот файл на любой путь, которого нет среди
      статических файлов (например /pandemia/profile) — а у нас это
      валидный маршрут одностраничного приложения, а не настоящая 404.
      Кодируем путь в query-строку и редиректим на index.html, где
      скрипт в index.html декодирует его обратно.
      См. https://github.com/rafgraph/spa-github-pages
    -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 1; // сегмент "/pandemia" в базовом пути репозитория

      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
